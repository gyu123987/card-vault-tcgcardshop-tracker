name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m unittest discover -s tests -p test_asset_setup.py
      - name: Verify private content is excluded
        shell: pwsh
        run: |
          $files = git ls-files
          if ($files | Where-Object { $_ -match '^(data/|public/assets/|dist/|\.tools/)' }) { throw 'Private or generated content is tracked' }
